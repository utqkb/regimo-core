classes:
  ProjectSubmission:
    name: ProjectSubmission
    definition_uri: https://example.org/regimo/ProjectSubmission
    description: Container for one or more measurement records
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slots:
    - projectSubmission__project_id
    - projectSubmission__operator_name
    - projectSubmission__records
    attributes:
      project_id:
        name: project_id
      operator_name:
        name: operator_name
      records:
        name: records
    class_uri: regimo:ProjectSubmission
    tree_root: true
  MeasurementRecord:
    name: MeasurementRecord
    definition_uri: https://example.org/regimo/MeasurementRecord
    description: Single temperature measurement with provenance
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slots:
    - measurementRecord__sample_unique_id
    - measurementRecord__measurement_time
    - measurementRecord__temperature_value
    - measurementRecord__temperature_unit
    - measurementRecord__instrument_calibration_date
    attributes:
      sample_unique_id:
        name: sample_unique_id
      measurement_time:
        name: measurement_time
      temperature_value:
        name: temperature_value
      temperature_unit:
        name: temperature_unit
      instrument_calibration_date:
        name: instrument_calibration_date
    class_uri: regimo:MeasurementRecord
