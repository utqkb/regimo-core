    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:sample_unique_id
    range: string
    required: true
  measurement_time:
    name: measurement_time
    definition_uri: https://example.org/regimo/measurement_time
    description: Date and time of the measurement
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:measurement_time
    range: datetime
    required: true
  temperature_value:
    name: temperature_value
    definition_uri: https://example.org/regimo/temperature_value
    description: Measured temperature value
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:temperature_value
    range: MeasurementValue
    required: true
  temperature_unit:
    name: temperature_unit
    definition_uri: https://example.org/regimo/temperature_unit
    description: Unit of the temperature
    from_schema: https://example.org/regimo/metadata_integrity_schema
    mappings:
