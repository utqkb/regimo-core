name: my_linkmk_schema
description: Enforces data integrity for temperature, 3-phase electrical measurements,
  and RDMO project metadata.
title: Regimo Metadata Integrity Schema
id: https://example.org/regimo/metadata_integrity_schema
version: 0.3.0
imports:
- linkml:types
license: MIT
prefixes:
  regimo:
    prefix_prefix: regimo
    prefix_reference: https://example.org/regimo/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
  oeo:
    prefix_prefix: oeo
    prefix_reference: http://openenergy-platform.org/ontology/oeo/
  rdmo:
    prefix_prefix: rdmo
    prefix_reference: https://rdmorganiser.github.io/terms/
default_prefix: regimo
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
slots:
  project_id:
    name: project_id
    definition_uri: https://example.org/regimo/project_id
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:project_id
    identifier: true
    owner: ProjectSubmission
    domain_of:
    - ProjectSubmission
    range: string
    required: true
    pattern: ^REGIMO-\d{4}-\d{3}$
  project_start_date:
    name: project_start_date
    definition_uri: https://example.org/regimo/project_start_date
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:project_start_date
    owner: ProjectSubmission
    domain_of:
    - ProjectSubmission
    range: date
    required: true
  operator_name:
    name: operator_name
    definition_uri: https://example.org/regimo/operator_name
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:operator_name
    owner: ProjectSubmission
    domain_of:
    - ProjectSubmission
    range: string
    required: true
  sample_unique_id:
    name: sample_unique_id
    definition_uri: https://example.org/regimo/sample_unique_id
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:sample_unique_id
    owner: MeasurementRecord
    domain_of:
    - MeasurementRecord
    range: string
    required: true
    pattern: ^SAMPLE-\d{3}$
  measurement_time:
    name: measurement_time
    definition_uri: https://example.org/regimo/measurement_time
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:measurement_time
    owner: MeasurementRecord
    domain_of:
    - MeasurementRecord
    range: datetime
    required: true
  instrument_calibration_date:
    name: instrument_calibration_date
    definition_uri: https://example.org/regimo/instrument_calibration_date
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:instrument_calibration_date
    owner: MeasurementRecord
    domain_of:
    - MeasurementRecord
    range: date
    required: true
  temperature_celsius:
    name: temperature_celsius
    definition_uri: https://example.org/regimo/temperature_celsius
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:temperature_celsius
    owner: MeasurementRecord
    domain_of:
    - MeasurementRecord
    range: float
    minimum_value: 10
    maximum_value: 40
  temperature_kelvin:
    name: temperature_kelvin
    definition_uri: https://example.org/regimo/temperature_kelvin
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:temperature_kelvin
    owner: MeasurementRecord
    domain_of:
    - MeasurementRecord
    range: float
    minimum_value: 283.15
    maximum_value: 313.15
  voltage_l1:
    name: voltage_l1
    definition_uri: https://example.org/regimo/voltage_l1
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:voltage_l1
    owner: MeasurementRecord
    domain_of:
    - MeasurementRecord
    range: float
    minimum_value: 200
    maximum_value: 250
  voltage_l2:
    name: voltage_l2
    definition_uri: https://example.org/regimo/voltage_l2
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:voltage_l2
    owner: MeasurementRecord
    domain_of:
    - MeasurementRecord
    range: float
    minimum_value: 200
    maximum_value: 250
  voltage_l3:
    name: voltage_l3
    definition_uri: https://example.org/regimo/voltage_l3
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:voltage_l3
    owner: MeasurementRecord
    domain_of:
    - MeasurementRecord
    range: float
    minimum_value: 200
    maximum_value: 250
  current_l1:
    name: current_l1
    definition_uri: https://example.org/regimo/current_l1
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:current_l1
    owner: MeasurementRecord
    domain_of:
    - MeasurementRecord
    range: float
    minimum_value: 0
    maximum_value: 16
  current_l2:
    name: current_l2
    definition_uri: https://example.org/regimo/current_l2
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:current_l2
    owner: MeasurementRecord
    domain_of:
    - MeasurementRecord
    range: float
    minimum_value: 0
    maximum_value: 16
  current_l3:
    name: current_l3
    definition_uri: https://example.org/regimo/current_l3
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:current_l3
    owner: MeasurementRecord
    domain_of:
    - MeasurementRecord
    range: float
    minimum_value: 0
    maximum_value: 16
  records:
    name: records
    definition_uri: https://example.org/regimo/records
    description: List of all measurement records in this submission.
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:records
    owner: ProjectSubmission
    domain_of:
    - ProjectSubmission
    range: MeasurementRecord
    multivalued: true
    inlined: true
    inlined_as_list: true
  rdmo_id:
    name: rdmo_id
    definition_uri: https://example.org/regimo/rdmo_id
    description: Primary key ID of the RDMO project.
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:rdmo_id
    identifier: true
    owner: RDMOProject
    domain_of:
    - RDMOProject
    range: integer
    required: true
  title:
    name: title
    definition_uri: https://example.org/regimo/title
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:title
    owner: RDMOProject
    domain_of:
    - RDMOProject
    range: string
    required: true
  description:
    name: description
    definition_uri: https://example.org/regimo/description
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:description
    owner: RDMOProject
    domain_of:
    - RDMOProject
    range: string
  created:
    name: created
    definition_uri: https://example.org/regimo/created
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:created
    owner: RDMOProject
    domain_of:
    - RDMOProject
    range: datetime
  updated:
    name: updated
    definition_uri: https://example.org/regimo/updated
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:updated
    owner: RDMOProject
    domain_of:
    - RDMOProject
    range: datetime
  attribute_path:
    name: attribute_path
    definition_uri: https://example.org/regimo/attribute_path
    description: RDMO attribute path (e.g., project/dataset/identifier).
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:attribute_path
    owner: QuestionnaireAnswer
    domain_of:
    - QuestionnaireAnswer
    range: string
    required: true
  value_text:
    name: value_text
    definition_uri: https://example.org/regimo/value_text
    description: Textual or URI answer provided in RDMO.
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:value_text
    owner: QuestionnaireAnswer
    domain_of:
    - QuestionnaireAnswer
    range: string
  value_datatype:
    name: value_datatype
    definition_uri: https://example.org/regimo/value_datatype
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:value_datatype
    owner: QuestionnaireAnswer
    domain_of:
    - QuestionnaireAnswer
    range: string
  unit:
    name: unit
    definition_uri: https://example.org/regimo/unit
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:unit
    owner: QuestionnaireAnswer
    domain_of:
    - QuestionnaireAnswer
    range: string
  answers:
    name: answers
    definition_uri: https://example.org/regimo/answers
    description: Collection of attribute answers belonging to this project.
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:answers
    owner: RDMOProject
    domain_of:
    - RDMOProject
    range: QuestionnaireAnswer
    multivalued: true
    inlined: true
    inlined_as_list: true
  linked_oep_datasets:
    name: linked_oep_datasets
    definition_uri: https://example.org/regimo/linked_oep_datasets
    description: Identifiers linking this RDMO project to OEP research datasets in
      Neo4j.
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slot_uri: regimo:linked_oep_datasets
    owner: RDMOProject
    domain_of:
    - RDMOProject
    range: string
    multivalued: true
classes:
  ProjectSubmission:
    name: ProjectSubmission
    definition_uri: https://example.org/regimo/ProjectSubmission
    description: Container for one or more measurement records.
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slots:
    - project_id
    - operator_name
    - project_start_date
    - records
    class_uri: regimo:ProjectSubmission
    tree_root: true
  MeasurementRecord:
    name: MeasurementRecord
    definition_uri: https://example.org/regimo/MeasurementRecord
    description: Single measurement event (Temperature or 3-Phase Power).
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slots:
    - sample_unique_id
    - measurement_time
    - instrument_calibration_date
    - temperature_celsius
    - temperature_kelvin
    - voltage_l1
    - voltage_l2
    - voltage_l3
    - current_l1
    - current_l2
    - current_l3
    class_uri: regimo:MeasurementRecord
  RDMOProject:
    name: RDMOProject
    definition_uri: https://example.org/regimo/RDMOProject
    description: Entity representing an RDMO project imported into Regimo.
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slots:
    - rdmo_id
    - title
    - description
    - created
    - updated
    - answers
    - linked_oep_datasets
    class_uri: regimo:RDMOProject
  QuestionnaireAnswer:
    name: QuestionnaireAnswer
    definition_uri: https://example.org/regimo/QuestionnaireAnswer
    description: Individual attribute-value response from an RDMO questionnaire.
    from_schema: https://example.org/regimo/metadata_integrity_schema
    slots:
    - attribute_path
    - value_text
    - value_datatype
    - unit
    class_uri: regimo:QuestionnaireAnswer
