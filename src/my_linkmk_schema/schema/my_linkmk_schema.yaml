id: https://example.org/regimo/metadata_integrity_schema
name: regimo_metadata_schema
title: Regimo Metadata Integrity Schema
description: Enforces data integrity, provenance and FAIR principles for temperature measurements.
version: 0.1.0
license: MIT

default_prefix: regimo
default_range: string

prefixes:
  regimo: https://example.org/regimo/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  oeo: http://openenergy-platform.org/ontology/oeo/

imports:
  - linkml:types

types:
  MeasurementValue:
    base: float
    uri: xsd:float
    description: Temperature reading as a floating-point number

enums:
  UnitOfTemperature:
    description: Allowed temperature units
    permissible_values:
      Kelvin:
        description: Kelvin scale
        meaning: oeo:OEO_00020034
      Celsius:
        description: Degrees Celsius
        meaning: oeo:OEO_00020035

classes:
  ProjectSubmission:
    tree_root: true
    description: Container for one or more measurement records
    attributes:
      project_id:
      operator_name:
      records:

  MeasurementRecord:
    description: Single temperature measurement with provenance
    attributes:
      sample_unique_id:
      measurement_time:
      temperature_value:
      temperature_unit:
      instrument_calibration_date:

slots:
  project_id:
    identifier: true
    required: true
    description: Unique project identifier

  operator_name:
    required: true
    description: Person responsible for the measurement

  sample_unique_id:
    required: true
    description: Unique identifier of the sample

  measurement_time:
    required: true
    range: datetime
    description: Date and time of the measurement

  temperature_value:
    required: true
    range: MeasurementValue
    description: Measured temperature value

  temperature_unit:
    required: true
    range: UnitOfTemperature
    slot_uri: oeo:OEO_00020035
    description: Unit of the temperature

  instrument_calibration_date:
    required: true
    range: date
    description: Date the instrument was last calibrated

  records:
    multivalued: true
    inlined: true
    inlined_as_list: true
    range: MeasurementRecord
    description: List of all measurement records in this submission
