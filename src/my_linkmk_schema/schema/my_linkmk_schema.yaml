id: https://example.org/regimo/metadata_integrity_schema
name: regimo_metadata_schema
title: Regimo Metadata Integrity Schema
description: Enforces data integrity for temperature and 3-phase electrical measurements.
version: 0.2.0
license: MIT

default_prefix: regimo
default_range: string

prefixes:
  regimo: https://example.org/regimo/
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  oeo: http://openenergy-platform.org/ontology/oeo/

imports:
  - linkml:types

classes:
  ProjectSubmission:
    tree_root: true
    description: Container for one or more measurement records.
    slots:
      - project_id
      - operator_name
      - project_start_date
      - records

  MeasurementRecord:
    description: Single measurement event (Temperature or 3-Phase Power).
    slots:
      - sample_unique_id
      - measurement_time
      - instrument_calibration_date
      # Temperature Slots
      - temperature_celsius
      - temperature_kelvin
      # 3-Phase Voltage Slots (Volts)
      - voltage_l1
      - voltage_l2
      - voltage_l3
      # 3-Phase Current Slots (Amperes)
      - current_l1
      - current_l2
      - current_l3

slots:
  project_id:
    identifier: true
    required: true
    pattern: "^REGIMO-\\d{4}-\\d{3}$"
  project_start_date:
    required: true
    range: date
  operator_name:
    required: true
  sample_unique_id:
    required: true
    pattern: "^SAMPLE-\\d{3}$"
  measurement_time:
    required: true
    range: datetime
  instrument_calibration_date:
    required: true
    range: date

  # --- Temperature Rules ---
  temperature_celsius:
    range: float
    minimum_value: 10
    maximum_value: 40
  temperature_kelvin:
    range: float
    minimum_value: 283.15
    maximum_value: 313.15

  # --- 3-Phase Electrical Rules ---
  voltage_l1:
    range: float
    minimum_value: 200
    maximum_value: 250
    description: Voltage on Phase 1 (Target 230V)
  voltage_l2:
    range: float
    minimum_value: 200
    maximum_value: 250
  voltage_l3:
    range: float
    minimum_value: 200
    maximum_value: 250

  current_l1:
    range: float
    minimum_value: 0
    maximum_value: 16
    description: Current on Phase 1 (Max 16A for standard lab socket)
  current_l2:
    range: float
    minimum_value: 0
    maximum_value: 16
  current_l3:
    range: float
    minimum_value: 0
    maximum_value: 16

  # Moved 'records' back inside the slots section
  records:
    multivalued: true
    inlined: true
    inlined_as_list: true
    range: MeasurementRecord
    description: List of all measurement records in this submission.