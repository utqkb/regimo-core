id: https://example.org/regimo/metadata_integrity_schema
name: regimo_metadata_schema
description: Schema enforcing Data Integrity (Completeness, Accuracy) and FAIR principles for energy research metadata.
default_prefix: regimo

prefixes:
  regimo: https://example.org/regimo/
  linkml: https://w3id.org/linkml/
  OEO: http://openenergy-platform.org/ontology/oeo/

types:
  MeasurementValue:
    base: float
    description: Ensures all measurement readings are numeric (accuracy)

enums:
  UnitOfTemperature:
    description: Units for temperature, mapped to OEO/PATO concepts.
    permissible_values:
      Kelvin:
        meaning: OEO:0000000000000001
      Celsius:
        meaning: OEO:0000000000000002

classes:
  ProjectSubmission:
    tree_root: true
    description: Container for metadata records being submitted via the MVP.
    slots:
      - project_id
      - operator_name
      - records

  MeasurementRecord:
    description: Core metadata fields required for data integrity and FAIRness.
    slots:
      - sample_unique_id
      - measurement_time
      - temperature_value
      - temperature_unit
      - instrument_calibration_date

slots:
  project_id:
    description: Unique ID for the project (FAIR: Findable, required for traceability).
    identifier: true
    required: true
    range: string

  operator_name:
    description: Name of the person responsible for the data collection.
    required: true
    range: string

  sample_unique_id:
    description: Unique identifier for the collected sample.
    required: true
    range: string

  measurement_time:
    description: Date and time when the measurement was taken.
    required: true
    range: datetime

  temperature_value:
    description: The recorded numerical temperature reading.
    required: true
    # Enforced to be a float via the custom type
    range: MeasurementValue

  temperature_unit:
    description: The physical unit for the temperature value.
    required: true
    # Must be one of the controlled values defined above
    range: UnitOfTemperature
    # Example semantic mapping
    slot_uri: http://openenergy-platform.org/ontology/oeo/OEO_00020035

  instrument_calibration_date:
    description: Date the instrument was last calibrated (provenance/integrity).
    required: true
    range: date

  records:
    description: List of individual measurement records.
    multivalued: true
    range: MeasurementRecord
    inlined: true
    inlined_as_list: true
