id: https://example.org/regimo/metadata_integrity_schema
name: regimo_metadata_schema
description: Schema enforcing Data Integrity (Completeness, Accuracy) and FAIR principles for energy research metadata.
default_prefix: regimo

prefixes:
  regimo: https://example.org/regimo/
  # your own namespace
  linkml: https://w3id.org/linkml/
  oeo: http://openenergy-platform.org/ontology/oeo/

imports:
  - linkml:types

types:
  MeasurementValue:
    base: float
    description: Numeric temperature measurement value

enums:
  UnitOfTemperature:
    description: Controlled vocabulary for temperature units
    permissible_values:
      Kelvin:
        meaning: oeo:OEO_00020034
      Celsius:
        meaning: oeo:OEO_00020035

classes:

  ProjectSubmission:
    tree_root: true
    description: Top-level container for a set of measurement records
    slots:
      - project_id
      - operator_name
      - records

  MeasurementRecord:
    description: One individual temperature measurement with full provenance
    slots:
      - sample_unique_id
      - measurement_time
      - temperature_value
      - temperature_unit
      - instrument_calibration_date

slots:

  project_id:
    identifier: true
    required: true
    description: Unique project identifier (FAIR Findable)
    range: string

  operator_name:
    required: true
    description: Person responsible for data collection
    range: string

  sample_unique_id:
    required: true
    description: Unique identifier of the physical sample
    range: string

  measurement_time:
    required: true
    description: Exact date and time of the measurement
    range: datetime

  temperature_value:
    required: true
    description: Measured temperature value (numeric only)
    range: MeasurementValue

  temperature_unit:
    required: true
    description: Unit of the temperature measurement (controlled vocabulary)
    range: UnitOfTemperature
    slot_uri: oeo:OEO_00020035

  instrument_calibration_date:
    required: true
    description: Date of last instrument calibration (provenance & integrity)
    range: date

  records:
    multivalued: true
    inlined: true
    inlined_as_list: true
    range: MeasurementRecord
    description: Collection of all measurement records in this submission
